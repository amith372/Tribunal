<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Cinzel for the wordmark, headings, verdicts and name plaques; EB Garamond for
      reading text. Both are Google faces, loaded here for the running app. The exported
      run record cannot link them — it has to open from disk with no network (specs.md
      Part 2) — so that file falls back to its own local stack; how it gets its type is a
      decision Stage 8 makes, not this one.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap"
    />
    <title>The Tribunal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
